name: Publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to publish, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      release_tag: ${{ github.event.inputs.release_tag || github.ref_name }}
      checkout_ref: ${{ github.event.inputs.release_tag || github.ref }}

  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Download archive
        uses: actions/download-artifact@v4
        with:
          name: mybb-rotating-ads
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: dist/*.zip
          body_path: CHANGELOG.md
